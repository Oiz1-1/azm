<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قطاع العزم الأمني</title>
    <style>
        body { background-color: #040d07; color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        .logo-img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #00ff66; margin: 15px 0; object-fit: cover; }
        h1 { color: #00ff66; font-size: 28px; margin-bottom: 20px; text-align: center; }
        h2 { color: #00ff66; font-size: 20px; margin-top: 25px; margin-bottom: 15px; border-bottom: 1px solid #143820; padding-bottom: 5px; text-align: center; width: 100%; }
        .btn-box { width: 100%; display: flex; gap: 10px; margin-bottom: 25px; }
        .btn { flex: 1; padding: 15px; border-radius: 12px; text-align: center; background: #00ff66; color: #040d07; font-weight: bold; text-decoration: none; font-size: 16px; border: none; }
        .profile-container { display: flex; justify-content: space-around; width: 100%; margin-bottom: 25px; gap: 10px; }
        .profile-box { text-align: center; flex: 1; background: #08160e; padding: 10px; border-radius: 12px; border: 1px solid #00ff66; }
        .profile-box img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #00ff66; margin-bottom: 5px; object-fit: cover; }
        .name { font-weight: bold; font-size: 14px; color: #00ff66; }
        .section-box { width: 100%; margin-bottom: 10px; }
        .drop-btn { width: 100%; background: #08160e; border: 1px solid #00ff66; color: #fff; padding: 18px 20px; border-radius: 10px; text-align: right; font-size: 17px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .drop-btn::after { content: '▼'; font-size: 12px; color: #00ff66; transition: transform 0.3s; }
        .section-box.active .drop-btn::after { transform: rotate(180deg); }
        .drop-content { display: none; background: #0c2012; padding: 15px; border-radius: 0 0 10px 10px; border: 1px solid #00ff66; border-top: none; font-size: 16px; color: #ddd; line-height: 1.8; }
        .section-box.active .drop-content { display: block; }
        .patrol-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .patrol-card { background: #08160e; border: 1px solid #143820; padding: 15px; border-radius: 10px; text-align: center; }
        .patrol-card b { color: #00ff66; font-size: 15px; }
        .patrol-card p { font-size: 13px; color: #ccc; margin-top: 5px; }
        .field-form { background: #08160e; border: 1px solid #00ff66; padding: 15px; border-radius: 10px; width: 100%; box-sizing: border-box; }
        input, select, textarea { width: 100%; background: #040d07; border: 1px solid #00ff66; color: #fff; padding: 12px; margin-bottom: 10px; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .submit-btn { width: 100%; background: #00ff66; color: #040d07; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <img src="IMG_0347.jpeg" class="logo-img" alt="الشعار">
    <h1>قطاع العزم الأمني</h1>

    <div class="btn-box">
        <a href="https://www.tiktok.com/@ssoh022?_r=1&_t=ZS-991jJVyMqJw" class="btn" target="_blank">تيك توك</a>
        <a href="https://discord.gg/KT9aYRC9y" class="btn" target="_blank">ديسكورد</a>
    </div>

    <!-- بقية المحتوى العادي... -->
    
    <h2>الحالة الميدانية والأرشيف</h2>
    <div class="field-form">
        <input type="text" id="repName" placeholder="أدخل اسم العسكري..." oninput="saveData()">
        <select id="repRank" onchange="saveData()">
            <option value="">اختر الرتبة...</option>
            <option value="اللواء ركن">اللواء ركن</option>
            <option value="ملازم">ملازم</option>
            <option value="جندي">جندي</option>
        </select>
        <!-- بقية حقول البلاغ بنفس النمط -->
        <select id="repWrap" onchange="saveData()"><option value="0">التجليد (0)</option><option value="1">1</option></select>
        <button class="submit-btn" onclick="addReport()">إرسال البلاغ</button>
    </div>

    <script>
        const REPORT_WEBHOOK = "https://discord.com/api/webhooks/1540393098754924624/DnTj3FlFHtx0-95wVZVnjxCBE0sVut-kdzeuLTxe_lXzc7WwiqYzu8PZ-utffHFr6aj_";

        // دالة الحفظ التلقائي
        function saveData() {
            let inputs = document.querySelectorAll('input, select, textarea');
            inputs.forEach(input => localStorage.setItem(input.id, input.value));
        }

        // استعادة البيانات عند تحميل الصفحة
        window.onload = () => {
            let inputs = document.querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                if(localStorage.getItem(input.id)) input.value = localStorage.getItem(input.id);
            });
        };

        async function addReport() {
            // ... منطق الإرسال ...
            // بعد الإرسال، نمسح الذاكرة
            localStorage.clear();
            alert("تم الإرسال بنجاح!");
        }

        function toggleSection(btn) { btn.parentElement.classList.toggle('active'); }
    </script>
</body>
</html>
