<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجهاز | القوات الخاصة لأمن الطرق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --primary-blue: #00f0ff;
            --dark-blue: #0066ff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --border-glow: rgba(0, 240, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 102, 255, 0.15) 0%, transparent 50%),
                linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8));
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* شاشة تسجيل الدخول */
        #auth-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            animation: fadeIn 0.8s ease-in-out;
        }

        .auth-card {
            background: var(--panel-bg);
            border: 2px solid var(--primary-blue);
            box-shadow: 0 0 25px var(--border-glow);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(12px);
        }

        .auth-card h1 {
            color: var(--primary-blue);
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,240,255,0.5);
        }

        .auth-card p {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--primary-blue);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary-blue);
            outline: none;
            box-shadow: 0 0 10px rgba(0,240,255,0.3);
        }

        .btn-tactical {
            background: linear-gradient(135deg, var(--dark-blue), var(--primary-blue));
            color: #000;
            font-weight: 700;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0,240,255,0.4);
        }

        .btn-tactical:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0,240,255,0.7);
        }

        /* لوحة التحكم الرئيسية */
        #dashboard {
            display: none;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header {
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-area h2 {
            font-size: 22px;
            color: var(--primary-blue);
            letter-spacing: 1px;
        }

        .user-badge {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--primary-blue);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--primary-blue);
        }

        /* محتوى المنصة */
        .main-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        /* القائمة المنسدلة التكتيكية */
        .dropdown-container {
            margin-bottom: 25px;
        }

        .dropdown-container label {
            display: block;
            margin-bottom: 10px;
            color: var(--primary-blue);
            font-weight: 600;
        }

        .select-tactical {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--primary-blue);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .select-tactical:focus {
            outline: none;
            box-shadow: 0 0 15px var(--border-glow);
        }

        /* أقسام النماذج مع تأثيرات الانيميشن */
        .form-section {
            display: none;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.4s ease;
        }

        .form-section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .form-section h3 {
            margin-bottom: 20px;
            color: var(--primary-blue);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 10px;
            font-size: 18px;
        }

        .form-row {
            margin-bottom: 18px;
        }

        .form-row label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-row input, .form-row textarea, .form-row select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }

        .form-row input:focus, .form-row textarea:focus {
            border-color: var(--primary-blue);
            outline: none;
        }

        /* رسائل التنبيه والنجاح */
        #alert-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #34d399;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--danger);
            color: #f87171;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول الإجباري -->
    <div id="auth-screen">
        <div class="auth-card">
            <h1>قوات أمن الطرق</h1>
            <p>منصة "الجهاز" - يرجى إدخال اسم المستخدم للتحقق من الصلاحيات</p>
            <div class="input-group">
                <label>اسم المستخدم (Discord Username)</label>
                <input type="text" id="username-input" placeholder="مثال: .0_iz أو rk.1k">
            </div>
            <button class="btn-tactical" onclick="login()">تسجيل الدخول</button>
            <div id="login-error" style="color: var(--danger); font-size: 13px; margin-top: 10px; display: none;">اسم المستخدم غير مسجل في النظام!</div>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="dashboard">
        <header>
            <div class="logo-area">
                <h2>الجهاز | أمن الطرق</h2>
            </div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div class="user-badge" id="user-info-badge">الرتبة: -</div>
                <button onclick="logout()" style="background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;">خروج</button>
            </div>
        </header>

        <div class="main-container">
            <div class="card-panel">
                <!-- القائمة المنسدلة التكتيكية -->
                <div class="dropdown-container">
                    <label>اختر القسم المطلوب:</label>
                    <select id="section-select" class="select-tactical" onchange="switchSection()">
                        <option value="" disabled selected>-- اختر القسم لتسجيل التقرير --</option>
                        <option value="duty">1. قسم الاستلام</option>
                        <option value="training">2. قسم التدريب</option>
                        <option value="media">3. قسم المشاركات الإعلامية</option>
                        <option value="tasks">4. قسم المهام الجانبية</option>
                        <option value="suggestions">5. قسم اقتراحات القطاع</option>
                    </select>
                </div>

                <!-- 1. قسم الاستلام -->
                <div id="section-duty" class="form-section">
                    <h3>تسجيل استلام ضابط</h3>
                    <div class="form-row"><label>الرتبة والاسم:</label><input type="text" id="duty-name" placeholder="أدخل رتبتك واهتمامك"></div>
                    <div class="form-row"><label>وقت بداية الاستلام:</label><input type="text" id="duty-start" placeholder="مثال: 08:00 مساءً"></div>
                    <div class="form-row"><label>وقت نهاية الاستلام:</label><input type="text" id="duty-end" placeholder="مثال: 12:00 مساءً"></div>
                    <div class="form-row"><label>ملاحظات الميدان:</label><textarea id="duty-notes" rows="3" placeholder="أدخل تفاصيل التواجد الأمني..."></textarea></div>
                    <button class="btn-tactical" onclick="sendReport('duty')">إرسال إلى ديوان العمليات</button>
                </div>

                <!-- 2. قسم التدريب -->
                <div id="section-training" class="form-section">
                    <h3>تسجيل دفعة التدريب</h3>
                    <div class="form-row"><label>المسؤول عن التدريب:</label><input type="text" id="train-admin" placeholder="اسم المدرب ورتبته"></div>
                    <div class="form-row"><label>عنوان أو نوع التدريب:</label><input type="text" id="train-title" placeholder="مثال: دورة المطاردات والسيطرة"></div>
                    <div class="form-row"><label>أسماء العناصر الحاضرين:</label><textarea id="train-attendees" rows="3" placeholder="أدخل الأسماء..."></textarea></div>
                    <button class="btn-tactical" onclick="sendReport('training')">إرسال تقرير التدريب</button>
                </div>

                <!-- 3. قسم المشاركات الإعلامية -->
                <div id="section-media" class="form-section">
                    <h3>تسجيل مشاركة إعلامية</h3>
                    <div class="form-row"><label>اسم الضابط:</label><input type="text" id="media-name" placeholder="اسمك الكريم ورتبتك"></div>
                    <div class="form-row"><label>رابط التغطية أو الميديا:</label><input type="text" id="media-link" placeholder="رابط الصورة أو الفيديو"></div>
                    <div class="form-row"><label>وصف التغطية:</label><textarea id="media-desc" rows="2" placeholder="تفاصيل الفعالية أو التغطية..."></textarea></div>
                    <button class="btn-tactical" onclick="sendReport('media')">إرسال التغطية</button>
                </div>

                <!-- 4. قسم المهام الجانبية -->
                <div id="section-tasks" class="form-section">
                    <h3>تسجيل مهام جانبية</h3>
                    <div class="form-row"><label>اسم الضابط:</label><input type="text" id="task-name" placeholder="أدخل اسمك"></div>
                    <div class="form-row"><label>طبيعة المهمة:</label><input type="text" id="task-desc" placeholder="مثال: تأمين طريق الساحل"></div>
                    <div class="form-row"><label>النتائج والإنجاز:</label><textarea id="task-result" rows="2" placeholder="ما تم إنجازه..."></textarea></div>
                    <button class="btn-tactical" onclick="sendReport('tasks')">إرسال المهمة</button>
                </div>

                <!-- 5. قسم الاقتراحات -->
                <div id="section-suggestions" class="form-section">
                    <h3>قسم اقتراحات القطاع</h3>
                    <div class="form-row"><label>اسم الضابط / القائد:</label><input type="text" id="sug-name" placeholder="اسمك"></div>
                    <div class="form-row"><label>نص الاقتراح للتطوير:</label><textarea id="sug-content" rows="4" placeholder="اكتب مقترحك لتطوير أمن الطرق..."></textarea></div>
                    <button class="btn-tactical" onclick="sendReport('suggestions')">رفع المقترح للقيادة</button>
                </div>

                <!-- رسالة الحالة -->
                <div id="alert-box"></div>
            </div>
        </div>
    </div>

    <script>
        // قاعدة بيانات اليوزرات والصلاحيات المعتمدة لديك
        const usersDatabase = {
            ".0_iz": { name: ".0_iz", role: "رائد / درع 2", type: "admin" },
            "vm5q": { name: "vm5q", role: "فريق أول ركن / قيادة 1", type: "admin" },
            "3vtw": { name: "3vtw", role: "فريق أول / قيادة 2", type: "admin" },
            "rk.1k": { name: "rk.1k", role: "ملازم / ميم 1", type: "officer" },
            "n.xr1": { name: "n.xr1", role: "ملازم / ميم 5", type: "officer" }
        };

        // الروابط (Webhooks) المعتمدة لكل روم
        const webhooks = {
            duty: "https://discord.com/api/webhooks/1559947331325919293/LxfHJp6VIUanaLz2l0N-QX60-ToEevufmcOm3S6oBxXkdqjupDna_sYBIHSF0ObUT8Kc",
            training: "https://discord.com/api/webhooks/1559947657625997313/usip6Diz2IALuEhuiGfj20eLdPh8AwHZwkVjKGy1zv1GaDjo6z92kUiec47ssmN1kd63",
            media: "https://discord.com/api/webhooks/1559947819253506168/qxjQLaAyUZOHGfOX5VZEl9M0YWR1fl0KzlRS_FshEf3MXtuk4AVHeLDJgHehpDrJCMvS",
            tasks: "https://discord.com/api/webhooks/1559949385251430430/4BplGPOkY2LMdUzgmLQ0Ui9hyxFEPBHH2Sn3Y2X8Ba6JuLr6rzn09jEXmnKX8rC", // مؤقتاً على اللوج العام
            suggestions: "https://discord.com/api/webhooks/1559949385251430430/4BplGPOkY2LMdUzgmLQ0Ui9hyxFEPBHH2Sn3Y2X8Ba6JuLr6rzn09jEXmnKX8rC", // مؤقتاً على اللوج العام
            log: "https://discord.com/api/webhooks/1559949385251430430/4BplGPOkY2LMdUzgmLQ0Ui9hyxFEPBHH2Sn3Y2X8Ba6JuLr6rzn09jEXmnKX8rC"
        };

        let currentUser = null;

        function login() {
            const inputVal = document.getElementById('username-input').value.trim();
            const errorDiv = document.getElementById('login-error');

            if(usersDatabase[inputVal]) {
                currentUser = usersDatabase[inputVal];
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('user-info-badge').innerText = `المستخدم: ${currentUser.name} (${currentUser.role})`;
                errorDiv.style.display = 'none';
            } else {
                errorDiv.style.display = 'block';
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('username-input').value = '';
        }

        // تأثير الحركة والانتقال السلس بين الأقسام
        function switchSection() {
            const selectedVal = document.getElementById('section-select').value;
            const sections = document.querySelectorAll('.form-section');
            
            sections.forEach(sec => {
                sec.classList.remove('active');
            });

            if(selectedVal) {
                const targetSec = document.getElementById(`section-${selectedVal}`);
                if(targetSec) {
                    setTimeout(() => {
                        targetSec.classList.add('active');
                    }, 50);
                }
            }
        }

        // إرسال البيانات للديسكورد عبر الـ Webhook
        async function sendReport(type) {
            let content = "";
            let title = "";

            if(type === 'duty') {
                title = "📌 [تسجيل استلام ضابط]";
                const name = document.getElementById('duty-name').value;
                const start = document.getElementById('duty-start').value;
                const end = document.getElementById('duty-end').value;
                const notes = document.getElementById('duty-notes').value;
                if(!name || !start) { showAlert("يرجى تعبئة الحقول الأساسية", "error"); return; }
                content = `**الضابط:** ${name}\n**وقت البداية:** ${start}\n**وقت النهاية:** ${end}\n**الملاحظات:** ${notes}`;
            } else if(type === 'training') {
                title = "🎖️ [تقرير تدريب عسكري]";
                const admin = document.getElementById('train-admin').value;
                const tTitle = document.getElementById('train-title').value;
                const attendees = document.getElementById('train-attendees').value;
                if(!admin || !tTitle) { showAlert("يرجى تعبئة الحقول الأساسية", "error"); return; }
                content = `**المدرب المسؤول:** ${admin}\n**عنوان التدريب:** ${tTitle}\n**الحاضرون:**\n${attendees}`;
            } else if(type === 'media') {
                title = "📸 [مشاركة إعلامية جديدة]";
                const name = document.getElementById('media-name').value;
                const link = document.getElementById('media-link').value;
                const desc = document.getElementById('media-desc').value;
                if(!name || !link) { showAlert("يرجى تعبئة الحقول الأساسية", "error"); return; }
                content = `**المرسل:** ${name}\n**الوصف:** ${desc}\n**الرابط:** ${link}`;
            } else if(type === 'tasks') {
                title = "⚡ [إنجاز مهمة جانبية]";
                const name = document.getElementById('task-name').value;
                const desc = document.getElementById('task-desc').value;
                const result = document.getElementById('task-result').value;
                if(!name || !desc) { showAlert("يرجى تعبئة الحقول الأساسية", "error"); return; }
                content = `**المنفذ:** ${name}\n**المهمة:** ${desc}\n**النتيجة:** ${result}`;
            } else if(type === 'suggestions') {
                title = "💡 [مقترح جديد للقطاع]";
                const name = document.getElementById('sug-name').value;
                const contentText = document.getElementById('sug-content').value;
                if(!name || !contentText) { showAlert("يرجى تعبئة الحقول الأساسية", "error"); return; }
                content = `**المقترح من:** ${name}\n**نص المقترح:**\n${contentText}`;
            }

            const payload = {
                embeds: [{
                    title: title,
                    description: content,
                    color: 30927, // لون أزرق تكتيكي
                    footer: { text: `بواسطة: ${currentUser.name} (${currentUser.role})` },
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                // إرسال للروم الخاص بالقسم
                await fetch(webhooks[type], {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // إرسال نسخة للوج العام
                await fetch(webhooks.log, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: `🔔 [لوج الجهاز] - تم تسجيل نشاط جديد`,
                            description: `تم إرسال بلاغ جديد في قسم (**${type}**) بواسطة العضو: **${currentUser.name}**`,
                            color: 16776960,
                            timestamp: new Date().toISOString()
                        }]
                    })
                });

                showAlert("تم إرسال التقرير بنجاح إلى رومات الديسكورد!", "success");
            } catch (err) {
                showAlert("حدث خطأ أثناء الإرسال، تأكد من الاتصال.", "error");
            }
        }

        function showAlert(msg, status) {
            const box = document.getElementById('alert-box');
            box.style.display = 'block';
            box.className = status === 'success' ? 'alert-success' : 'alert-error';
            box.innerText = msg;
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
