<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قطاع العزم الأمني - العمليات الميدانية</title>
    <style>
        body { background-color: #040d07; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 15px; min-height: 100vh; }
        .logo-img { width: 130px; height: 130px; border-radius: 50%; border: 3px solid #00ff66; margin: 15px 0; object-fit: cover; }
        h1 { color: #00ff66; font-size: 26px; margin-bottom: 5px; text-align: center; }
        h2 { color: #00ff66; font-size: 18px; margin-top: 25px; margin-bottom: 15px; border-bottom: 1px solid #143820; padding-bottom: 5px; text-align: center; width: 100%; }
        .section-card { background-color: #08160e; border: 1px solid #143820; border-radius: 12px; padding: 15px; width: 100%; max-width: 400px; box-sizing: border-box; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #00ff66; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; background-color: #040d07; border: 1px solid #00ff66; border-radius: 8px; color: #fff; font-size: 15px; box-sizing: border-box; }
        .action-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .submit-btn { background-color: #00ff66; color: #040d07; }
        .danger-btn { background-color: #ff3333; color: #fff; }
        .user-info-display { text-align: center; margin-bottom: 15px; font-size: 14px; color: #00ff66; background: #08160e; padding: 8px 15px; border-radius: 20px; border: 1px solid #143820; width: 100%; max-width: 400px; box-sizing: border-box; }
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(4, 13, 7, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; box-sizing: border-box; }
        .auth-card { background-color: #08160e; border: 2px solid #00ff66; border-radius: 15px; padding: 20px; width: 100%; max-width: 380px; text-align: center; }
    </style>
</head>
<body>

    <div id="authOverlay" style="display: none;">
        <div class="auth-card">
            <h2 style="margin-top:0;">بوابة الدخول العسكري</h2>
            <p style="font-size: 13px; color: #ccc;">أدخل بياناتك لربطها بجهازك (لمرة واحدة)</p>
            <input type="text" id="regName" placeholder="الاسم العسكري...">
            <select id="regRank">
                <option value="">اختر رتبتك...</option>
                <option value="لواء ركن">لواء ركن</option>
                <option value="عقيد">عقيد</option>
                <option value="ملازم أول">ملازم أول</option>
                <option value="ملازم">ملازم</option>
                <option value="رئيس رقباء">رئيس رقباء</option>
                <option value="رقيب">رقيب</option>
                <option value="عريف">عريف</option>
                <option value="جندي">جندي</option>
            </select>
            <input type="text" id="regDiscord" placeholder="يوزر الديسكورد...">
            <button class="action-btn submit-btn" onclick="saveRegistration()">اعتماد الدخول</button>
        </div>
    </div>

    <img src="IMG_0347.jpeg" class="logo-img" alt="الشعار">
    <h1>قطاع العزم الأمني</h1>
    <div id="userInfoDisplay" class="user-info-display" style="display: none;"></div>

    <div class="section-card">
        <h2 style="margin-top:0;">بصمة الدوام الرسمي</h2>
        <div style="text-align: center;">
            <p id="dutyStatusText" style="margin-bottom: 10px; font-size: 13px; color: #ccc;">الحالة: غير مسجل حضور</p>
            <button id="startDutyBtn" class="action-btn submit-btn" onclick="startDuty()">🟢 بدء الدوام (تسجيل حضور)</button>
            <button id="endDutyBtn" class="action-btn danger-btn" onclick="endDuty()" style="display: none;">🔴 إنهاء الدوام وإرسال التقرير</button>
        </div>
    </div>

    <div class="section-card">
        <h2 style="margin-top:0;">الحالة الميدانية</h2>
        <select id="repType">
            <option value="">اختر نوع الحالة...</option>
            <option value="مطاردة">مطاردة</option>
            <option value="استيقاف مروري">استيقاف مروري</option>
            <option value="تهريب">تهريب</option>
        </select>
        <textarea id="repDesc" rows="2" placeholder="تفاصيل إضافية..."></textarea>
        <button class="action-btn submit-btn" onclick="sendReport()">إرسال البلاغ للديسكورد</button>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1540393098754924624/DnTj3FlFHtx0-95wVZVnjxCBE0sVut-kdzeuLTxe_lXzc7WwiqYzu8PZ-utffHFr6aj_";

        window.onload = function() {
            if (!localStorage.getItem('military_name')) {
                document.getElementById('authOverlay').style.display = 'flex';
            } else {
                initUser();
            }
        };

        function saveRegistration() {
            let name = document.getElementById('regName').value.trim();
            let rank = document.getElementById('regRank').value;
            let discord = document.getElementById('regDiscord').value.trim();
            if(!name || !rank || !discord) { alert("يرجى تعبئة جميع الحقول!"); return; }
            localStorage.setItem('military_name', name);
            localStorage.setItem('military_rank', rank);
            localStorage.setItem('military_discord', discord);
            document.getElementById('authOverlay').style.display = 'none';
            initUser();
            alert("تم حفظ هويتك بنجاح!");
        }

        function initUser() {
            let name = localStorage.getItem('military_name');
            let rank = localStorage.getItem('military_rank');
            document.getElementById('userInfoDisplay').innerHTML = `👤 العسكري: <b>[${rank}] ${name}</b>`;
            document.getElementById('userInfoDisplay').style.display = 'block';
            checkDuty();
        }

        function startDuty() {
            let startTime = new Date().toLocaleString('ar-SA');
            localStorage.setItem('duty_start', startTime);
            localStorage.setItem('on_duty', 'true');
            checkDuty();
            alert("تم تسجيل بدء الدوام بنجاح!");
        }

        async function endDuty() {
            let name = localStorage.getItem('military_name');
            let rank = localStorage.getItem('military_rank');
            let start = localStorage.getItem('duty_start');
            let end = new Date().toLocaleString('ar-SA');

            let msg = `🚨 **[تقرير بصمة دوام]**\n👤 **العسكري:** ${name}\n🎖️ **الرتبة:** ${rank}\n🟢 **وقت الحضور:** ${start}\n🔴 **وقت الانصراف:** ${end}\n⏳ **الحالة:** تم إنهاء الدوام.`;

            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: msg})
            });

            localStorage.removeItem('on_duty');
            localStorage.removeItem('duty_start');
            checkDuty();
            alert("تم إنهاء الدوام وإرسال التقرير للديسكورد!");
        }

        function checkDuty() {
            let onDuty = localStorage.getItem('on_duty');
            if(onDuty === 'true') {
                document.getElementById('dutyStatusText').innerHTML = `الحالة: <span style="color:#00ff66;">على رأس العمل (من: ${localStorage.getItem('duty_start')})</span>`;
                document.getElementById('startDutyBtn').style.display = 'none';
                document.getElementById('endDutyBtn').style.display = 'block';
            } else {
                document.getElementById('dutyStatusText').innerHTML = `الحالة: <span style="color:#ff3333;">غير مسجل حضور</span>`;
                document.getElementById('startDutyBtn').style.display = 'block';
                document.getElementById('endDutyBtn').style.display = 'none';
            }
        }

        async function sendReport() {
            let name = localStorage.getItem('military_name');
            let rank = localStorage.getItem('military_rank');
            let type = document.getElementById('repType').value;
            let desc = document.getElementById('repDesc').value;
            if(!type) { alert("اختر نوع الحالة!"); return; }

            let msg = `📢 **[بلاغ ميداني]**\n👤 **العسكري:** ${name}\n🎖️ **الرتبة:** ${rank}\n⚡ **نوع الحالة:** ${type}\n📝 **التفاصيل:** ${desc || 'لا توجد'}`;

            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: msg})
            });
            alert("تم إرسال البلاغ بنجاح!");
        }
    </script>
</body>
</html>
