<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحت الصيانة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b110e;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .maintenance-container {
            background-color: #121814;
            border: 2px solid #222;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 90%;
        }
        .maintenance-container h1 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 15px;
        }
        .maintenance-container p {
            color: #9e9e9e;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <h1>الموقع تحت الصيانة</h1>
        <p>نعمل حالياً على تحديث وتطوير النظام. سنعود للعمل قريباً، شكراً لتفهمكم.</p>
    </div>

</body>
</html>
