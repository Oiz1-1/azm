<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قطاع برق الأمني - تحت الصيانة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b110e;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .maintenance-container {
            background-color: #121814;
            border: 2px solid #1e4620;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(30, 70, 32, 0.4);
            max-width: 500px;
            width: 90%;
        }
        .maintenance-container h1 {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 15px;
        }
        .maintenance-container p {
            color: #b0bec5;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background-color: #1a241c;
            color: #81c784;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #2e7d32;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <h1>⚡ قطاع برق الأمني ⚡</h1>
        <p>الموقع حالياً تحت أعمال التطوير والتحديث الشامل لهيكلة القوات الخاصة لأمن الطرق. نعود لكم قريباً بحلة جديدة بالكامل.</p>
        <div class="badge">القوات الخاصة لأمن الطرق - عمليات الصيانة</div>
    </div>

</body>
</html>
