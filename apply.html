<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تقديم قطاع العزم الأمني</title>
    <style>
        body { 
            background-color: #040d07; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            margin: 0; 
            padding: 15px; 
            box-sizing: border-box;
        }

        .logo-img { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            border: 3px solid #00ff66; 
            margin-bottom: 12px; 
            object-fit: cover; 
        }

        h1 { 
            color: #00ff66; 
            font-size: 20px; 
            margin-bottom: 15px; 
            text-align: center; 
        }

        .field-form { 
            background: #08160e; 
            border: 2px solid #00ff66; 
            padding: 18px; 
            border-radius: 15px; 
            width: 100%; 
            max-width: 360px; 
            box-sizing: border-box; 
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.15);
        }

        label { 
            font-size: 12px; 
            color: #00ff66; 
            display: block; 
            margin-bottom: 4px; 
            font-weight: bold;
        }

        input, textarea { 
            width: 100%; 
            background: #040d07; 
            border: 1px solid #00ff66; 
            color: #fff; 
            padding: 11px; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px; 
            outline: none;
        }

        input::placeholder, textarea::placeholder {
            color: #666;
        }

        textarea {
            resize: none;
            height: 70px;
        }

        .submit-btn { 
            width: 100%; 
            background: #00ff66; 
            color: #040d07; 
            border: none; 
            padding: 11px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 15px; 
            cursor: pointer; 
            margin-top: 5px;
        }

        .submit-btn:active {
            background: #00cc52;
        }
    </style>
</head>
<body>

    <img src="IMG_0347.jpeg" class="logo-img" alt="الشعار">
    <h1>قطاع العزم الأمني</h1>

    <!-- نموذج التقديم العسكري -->
    <div class="field-form">
        <label>👤 الاسم الثنائي:</label>
        <input type="text" id="appName" placeholder="اكتب اسمك الثنائي...">
        
        <label>💬 يوزر الديسكورد (اكتبه كتابة يدوية):</label>
        <input type="text" id="appDiscord" placeholder="مثال: username دون رموز أو أرقام مشفرة">

        <label>🛡️ هل تملك خبرات سابقة؟</label>
        <input type="text" id="appExperience" placeholder="ذكر الخبرات السابقة إن وجدت...">

        <label>🎯 هدفك من الانضمام لقطاع العزم الأمني:</label>
        <textarea id="appGoal" placeholder="اكتب هدفك باختصار..."></textarea>
        
        <button class="submit-btn" onclick="sendApplication()">إرسال الطلب 🚀</button>
    </div>

    <script>
        const APPLY_WEBHOOK = "https://discord.com/api/webhooks/1540407696170156244/y-XWYWIr1CJuoUU3erFK9zEckqGZTRd4XrlCpROLiscR5eHxpO8JVfvR1m__NeULLfvh";

        async function sendApplication() {
            let name = document.getElementById('appName').value.trim();
            let discord = document.getElementById('appDiscord').value.trim();
            let experience = document.getElementById('appExperience').value.trim();
            let goal = document.getElementById('appGoal').value.trim();

            if(!name || !discord || !experience || !goal) {
                alert("يرجى تعبئة جميع خانات نموذج التقديم قبل الإرسال!");
                return;
            }

            // تنبيه بسيط إذا حاول المستخدم وضع رموز مشفرة طويلة
            if(discord.length > 35 || /^[A-Z0-9]{15,}$/.test(discord)) {
                alert("تنبيه: يرجى كتابة يوزر الديسكورد الصحيح وليس رمز الحساب أو التوكن!");
                return;
            }

            let messageText = `📝 **[طلب تقديم عسكري جديد]**\n\n👤 **الاسم الثنائي:** ${name}\n💬 **يوزر الديسكورد:** ${discord}\n🛡️ **الخبرات السابقة:** ${experience}\n🎯 **الهدف من الانضمام:** ${goal}`;

            let response = await fetch(APPLY_WEBHOOK, {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: messageText })
            });

            if(response.ok || response.status === 204) {
                alert("تم إرسال طلب التقديم بنجاح إلى روم التقديم!");
                document.getElementById('appName').value = "";
                document.getElementById('appDiscord').value = "";
                document.getElementById('appExperience').value = "";
                document.getElementById('appGoal').value = "";
            } else {
                alert("حدث خطأ أثناء الإرسال، تأكد من اتصالك.");
            }
        }
    </script>
</body>
</html>
