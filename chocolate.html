<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براند الشوكليت التجريبي</title>
    <style>
        body {
            background-color: #1a0f0d;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        h1 {
            color: #d4af37;
            font-size: 24px;
            margin-bottom: 5px;
        }

        p {
            color: #b08d57;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .choco-box {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #3d2314, #5c3a21);
            border-radius: 20px;
            border: 2px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
            animation: moveSides 3s ease-in-out infinite alternate;
        }

        @keyframes moveSides {
            0% {
                transform: translateX(-60px) rotate(-5deg);
            }
            100% {
                transform: translateX(60px) rotate(5deg);
            }
        }

        .btn {
            margin-top: 40px;
            background: #d4af37;
            color: #1a0f0d;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <h1>فاخر الشوكليت</h1>
    <p>تجربة حركية تفاعلية للبراند</p>

    <div class="choco-box">
        🍫
    </div>

    <button class="btn" onclick="alert('أهلاً بك في عالم الشوكليت الفاخر!')">اطلب الان</button>

</body>
</html>
